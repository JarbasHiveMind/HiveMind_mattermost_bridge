[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-mattermost-bridge"
description = "Bridge a Mattermost bot account to a HiveMind node"
readme = "readme.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest"]
# REAL HiveMind-side end-to-end deps (tests/e2e). hivescope boots a real
# hivemind-core loopback hub the bridge drives over a real HiveMessageBusClient.
# Pinned to the whitelist-only-connection branch until that fix lands in a
# hivescope release; the hivemind-core/hivescope stack is alpha, so installs
# must allow prereleases (UV_PRERELEASE=allow / pip --pre). The e2e CI job
# passes --pre for exactly this reason.
e2e = [
    "pytest",
    "hivescope @ git+https://github.com/JarbasHiveMind/hivescope.git@fix/loopback-whitelist-only-connection",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind_mattermost_bridge"

[project.scripts]
hivemind-mattermost-bridge = "mattermost_bridge.__main__:main"

[tool.setuptools]
packages = ["mattermost_bridge"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "mattermost_bridge.version.__version__" }
dependencies = { file = ["requirements.txt"] }
