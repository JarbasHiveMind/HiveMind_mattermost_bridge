[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-mattermost-bridge"
description = "Bridge a Mattermost bot account to a HiveMind node"
readme = "readme.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest"]
# REAL HiveMind-side end-to-end deps (tests/e2e). hivescope boots a real
# hivemind-core loopback hub the bridge drives over a real HiveMessageBusClient.
# hivescope>=0.5.2a1 carries the loopback + ACL fixes and floors the bus-client
# 2.x stack (PEP 440 prerelease floor), so it resolves from PyPI with no --pre
# and the e2e suite runs under the shared build-tests workflow.
e2e = [
    "pytest",
    "hivescope>=0.8.0a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind_mattermost_bridge"

[project.scripts]
hivemind-mattermost-bridge = "mattermost_bridge.__main__:main"

[tool.setuptools]
packages = ["mattermost_bridge"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "mattermost_bridge.version.__version__" }
dependencies = { file = ["requirements.txt"] }
