name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # Network-free tests only: all of tests/, less tests/e2e. The REAL
      # HiveMind-side e2e (tests/e2e) needs prerelease hivemind-core/hivescope
      # from a git branch and runs in its own job
      # (.github/workflows/e2e_tests.yml).
      test_path: 'tests/ --ignore=tests/e2e'
